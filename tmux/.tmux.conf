# tmux v1 baseline — prefix C-b, Ghostty true-color, plugin-free.
# Prefix: keep default C-b (avoids GNOME/readline C-a collision).
set -g prefix C-b
bind C-b send-prefix

# Ghostty compat: 256-color + true-color (RGB).
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",xterm-ghostty:RGB,xterm-256color:RGB"

# Minimal habits.
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g history-limit 10000

# Minimal statusline.
set -g status-style "fg=white,bg=black"
set -g status-left "#S "
set -g status-right "%H:%M %d-%b"
