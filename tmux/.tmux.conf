# tmux v1 baseline — prefix C-b, Ghostty true-color, plugin-free.
# Prefix: keep default C-b (avoids GNOME/readline C-a collision).
set -g prefix C-b
bind C-b send-prefix

# Ghostty compat: 256-color + true-color (RGB).
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",xterm-ghostty:RGB,xterm-256color:RGB"

# Minimal habits.
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g history-limit 10000

# Mizuki statusline — Niigo Night bar, Mizuki Pink accents, Uniform Gray idle.
# Palette: bg #1E1B26 night / #2A2433 surface, fg #F4E3EB lace,
# accent #DDAACC mizuki / #F4A9C6 hair, mark #8E3B5C ribbon, dim #A2A6BD gray.
set -g status-style "fg=#F4E3EB,bg=#2A2433"
setw -g window-status-style "fg=#A2A6BD,bg=#2A2433"
setw -g window-status-current-style "fg=#F4A9C6,bg=#2A2433,bold"
setw -g window-status-format " #I:#W "
setw -g window-status-current-format " #I:#W "
setw -g pane-border-style "fg=#3A3344"
setw -g pane-active-border-style "fg=#8E3B5C"
set -g message-style "fg=#F4E3EB,bg=#8E3B5C,bold"
setw -g mode-style "fg=#1E1B26,bg=#DDAACC,bold"
setw -g clock-mode-colour "#DDAACC"
set -g status-left "#[fg=#DDAACC,bold]#S#[default] "
set -g status-right "%H:%M %d-%b"
